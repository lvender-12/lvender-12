name: Generate Trophies Card

on:
  schedule:
    - cron: "0 */12 * * *" # Diperbaiki berjalan tepat setiap 12 jam (bukan tiap menit)
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate trophies.svg
        uses: ryo-ma/github-profile-trophy-action@v1.3.1
        with:
          target_user: ${{ github.repository_owner }}
          theme: dracula
          column: 3
          margin-w: 15

      - name: Move to dist
        run: |
          mkdir -p dist
          mv trophy.svg dist/trophy.svg

      - name: Push trophy.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
